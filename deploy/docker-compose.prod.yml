# deploy/docker-compose.prod.yml
#
# Production Docker Compose for running the pipeline on any Linux VM.
# Cloud-agnostic: works on AWS EC2, GCP CE, DigitalOcean, bare metal.
#
# Usage:
#   docker compose -f deploy/docker-compose.prod.yml up -d
#   docker compose -f deploy/docker-compose.prod.yml logs -f pipeline-worker

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # NOT exposed to host — only reachable inside the Docker network
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server
        --appendonly yes
        --maxmemory 128mb
        --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pipeline-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    restart: unless-stopped
    env_file: /opt/pipeline/.env
    volumes:
      - /data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  pipeline-serializer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    command: ["python", "-m", "pipeline.main", "--serialize-only"]
    restart: unless-stopped
    env_file: /opt/pipeline/.env
    volumes:
      - /data:/data
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  redis-data:
