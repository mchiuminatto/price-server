version: "3.9"
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  pipeline-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    environment:
      - PIPELINE_REDIS_URL=redis://redis:6379/0
      - PIPELINE_STORAGE_BACKEND=local
      - PIPELINE_INPUT_BASE_PATH=/data/raw
      - PIPELINE_OUTPUT_BASE_PATH=/data/processed
      - PIPELINE_CONFIG_PATH=/app/config/pipeline_config.yaml
      - PIPELINE_WORKER_COUNT=2
    volumes:
      - pipeline-data:/data
      - ../config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy

  pipeline-serializer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    command: ["python", "-m", "pipeline.main", "--serialize-only"]
    environment:
      - PIPELINE_REDIS_URL=redis://redis:6379/0
      - PIPELINE_STORAGE_BACKEND=local
      - PIPELINE_INPUT_BASE_PATH=/data/raw
      - PIPELINE_OUTPUT_BASE_PATH=/data/processed
      - PIPELINE_CONFIG_PATH=/app/config/pipeline_config.yaml
    volumes:
      - pipeline-data:/data
      - ../config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - serialize

volumes:
  pipeline-data:
