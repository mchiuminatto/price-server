# Serializer (Step 1) — always-on Deployment that listens on pipeline_trigger_queue.
# For scheduled runs, replace with a CronJob (see deployment-serializer-cronjob.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-serializer
  namespace: price-pipeline
  labels:
    app: pipeline-serializer
    app.kubernetes.io/part-of: price-pipeline
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-serializer
  template:
    metadata:
      labels:
        app: pipeline-serializer
    spec:
      serviceAccountName: pipeline-worker
      containers:
        - name: serializer
          image: "<ECR_PIPELINE_REPO_URL>:latest"
          command: ["python", "-m", "pipeline.main", "--serialize-only"]
          envFrom:
            - configMapRef:
                name: pipeline-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      restartPolicy: Always
---
