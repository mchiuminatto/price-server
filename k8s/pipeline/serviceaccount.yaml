# ServiceAccount with IRSA annotation — pods assume the IAM role to access S3.
# Replace <PIPELINE_WORKER_ROLE_ARN> with the terraform output `pipeline_worker_role_arn`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-worker
  namespace: price-pipeline
  annotations:
    eks.amazonaws.com/role-arn: "<PIPELINE_WORKER_ROLE_ARN>"
  labels:
    app.kubernetes.io/part-of: price-pipeline
