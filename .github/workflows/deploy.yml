name: Deploy Pipeline

on:
  push:
    branches: [main]

# Cloud-agnostic: SSH into the VM, pull code, rebuild containers.
# Set these secrets in GitHub → Settings → Secrets:
#   DEPLOY_HOST       — public IP of the pipeline VM
#   DEPLOY_USER       — SSH user (ubuntu / root)
#   DEPLOY_SSH_KEY    — private SSH key (ed25519 or RSA)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/opt/pipeline/app"

            # Pull latest code
            if [ -d "$APP_DIR/.git" ]; then
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            else
              git clone ${{ github.server_url }}/${{ github.repository }}.git "$APP_DIR"
              cd "$APP_DIR"
            fi

            # Rebuild and restart containers (zero-downtime for Redis)
            docker compose -f deploy/docker-compose.prod.yml build
            docker compose -f deploy/docker-compose.prod.yml up -d --remove-orphans

            # Show running containers
            docker compose -f deploy/docker-compose.prod.yml ps
